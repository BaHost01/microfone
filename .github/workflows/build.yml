name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install UPX
      run: choco install upx

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller sounddevice

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name "Ilove" --icon "icon.ico" --upx-dir "C:\ProgramData\chocolatey\bin" troll_mic.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ilove-Windows
        path: dist/Ilove.exe

    - name: Send to Discord Webhook
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD }}
      run: |
        curl -X POST -F "file=@dist/Ilove.exe" -F "content=🚀 **Nova Build Otimizada do Ilove.exe pronta!** (Tamanho Reduzido)" $env:DISCORD_WEBHOOK
